plugins { id 'com.android.application' }

// The hosted POS this app opens. If it moves, change it here and in public/.well-known/assetlinks.json's host.
def host = 'possum.farizz-a.workers.dev'

// The release key stays outside the repo (see twa/README.md). Without it the release APK comes out unsigned.
def keyProps = new Properties()
def keyFile = file(System.getenv('TAKAR_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/Documents/takar-android/keystore.properties")
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
  namespace 'app.takar.pos'
  compileSdk 37
  buildFeatures { resValues true }
  defaultConfig {
    applicationId 'app.takar.pos'
    minSdk 24
    targetSdk 36
    versionCode 3
    versionName '1.0.2'
    resValue 'string', 'launchUrl', "https://${host}/"
    resValue 'string', 'assetStatements', "[{\\\"relation\\\":[\\\"delegate_permission/common.handle_all_urls\\\"],\\\"target\\\":{\\\"namespace\\\":\\\"web\\\",\\\"site\\\":\\\"https://${host}\\\"}}]"
    manifestPlaceholders = [hostName: host]
  }
  signingConfigs {
    release {
      if (keyFile.exists()) {
        storeFile file(keyProps.storeFile)
        storePassword keyProps.storePassword
        keyAlias keyProps.keyAlias
        keyPassword keyProps.keyPassword
      }
    }
  }
  buildTypes { release { if (keyFile.exists()) signingConfig signingConfigs.release } }
}

dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
